name: VNV Incremental Migration — Wave 01 Source Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check read-only audit syntax
        run: node --check scripts/wave-01-public-gateway-audit.mjs
      - name: Inspect pinned homepage and local public dependencies
        run: node scripts/wave-01-public-gateway-audit.mjs
      - name: Retain audit-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnv-incremental-wave-01-evidence
          path: wave-01-report.json
          if-no-files-found: error
          retention-days: 30
